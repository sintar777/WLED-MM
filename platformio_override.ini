; =============================================================================
; WLED-MM platformio_override.ini — Huidu HD-WF2 (ESP32-S3, 8 MB Flash)
;                                    with QiangLi P5 SM16395+SM5368 panels
; =============================================================================
;
; Hardware:
;   Controller : Huidu HD-WF2  (ESP32-S3, 8 MB Flash, no PSRAM)
;   Display    : 2 × QiangLi P5 64×32 panels, SM16395+SM5368PS, 1/8-scan
;   Connection : Panels chained via HUB75E port X1, stacked vertically → 64×64
;
; Pin mapping (hard-wired in bus_manager.cpp for CONFIG_IDF_TARGET_ESP32S3
;              WITHOUT BOARD_HAS_PSRAM):
;   R1=2  G1=6  B1=10   R2=3  G2=7  B2=11
;   A=39  B=38  C=37    D=36  E=21
;   LAT=33  OE=35  CLK=34
;
; WLED LED-output settings to apply after flashing:
;   LED type  : Hub75Matrix_HS  (type 106, 64×32 half-scan)
;   Chain     : 2 panels
;   2D config : single matrix, 64 wide × 64 tall
;
; SM16395 driver notes:
;   The SM16395 requires a proprietary init sequence different from FM6126A.
;   WLED-MM automatically runs sm16395_init() when LED type 106 is selected.
;   No recompilation is needed to change display settings via the WLED UI.
; =============================================================================

[platformio]
default_envs = esp32S3_HD_WF2_8MB

; ---------------------------------------------------------------------------
; esp32S3_HD_WF2_8MB  – Huidu HD-WF2 with 8 MB flash, HUB75 enabled
; Inherits from the upstream esp32S3_4MB_S environment (designed for HD-WF2)
; but overrides the partition table and release name for 8 MB flash.
; ---------------------------------------------------------------------------
[env:esp32S3_HD_WF2_8MB]
; Use the same base settings as the official HD-WF2 4 MB env but with 8 MB parts.
extends = env:esp32S3_4MB_S

; ---- Platform (espressif32 ~6.3.2 + arduino-esp32 v2.0.9) ----------------
platform          = espressif32 @ ~6.3.2
platform_packages = platformio/framework-arduinoespressif32 @ 3.20009.0

; ---- Board -----------------------------------------------------------------
board             = esp32-s3-devkitc-1
; NOTE: do NOT define ARDUINO_ADAFRUIT_MATRIXPORTAL_ESP32S3 here.
;       That board define selects the MatrixPortal pin mapping, which is
;       wrong for HD-WF2.  The HD-WF2 pin mapping is selected automatically
;       when CONFIG_IDF_TARGET_ESP32S3 is defined WITHOUT BOARD_HAS_PSRAM.

; ---- Flash -----------------------------------------------------------------
board_build.partitions = tools/WLED_ESP32_8MB.csv   ; 3.3 MB firmware + 4 MB FS
board_build.f_flash    = 80000000L
board_build.flash_mode = dio                         ; dio is more stable than qio on HD-WF2

; ---- Build flags -----------------------------------------------------------
build_flags =
  ${common.build_flags}
  ${esp32s3.build_flags}
  -Wno-misleading-indentation
  -Wno-format-truncation
  ${common_mm.build_flags_S}
  ${common_mm.HUB75_build_flags}
  -D WLED_RELEASE_NAME=HD_WF2_8MB_SM16395
  ; --- USB mode: HD-WF2 uses a CH340 serial-to-USB chip, not Hardware CDC ---
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  -D WLED_DISABLE_ADALIGHT        ; prevent garbage commands on unconnected RX pin
  ; --- Stability ------------------------------------------------------------
  -D WLED_WATCHDOG_TIMEOUT=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  ; --- Memory savings -------------------------------------------------------
  -D WLEDMM_SAVE_FLASH
  -D JSON_BUFFER_SIZE=18432
  -D SR_DMTYPE=254                ; audio-reactive: Network Receive Only (no FFT buffers)
  ; --- Performance ----------------------------------------------------------
  -D WLEDMM_FASTPATH              ; lower LED latency, faster frame rate
  ; --- Disable interfaces that conflict with HD-WF2 I2S pins ---------------
  ${common_mm.build_disable_sync_interfaces}

; ---- Library dependencies --------------------------------------------------
lib_deps =
  ${esp32s3.lib_deps}
  ${common_mm.lib_deps_S}
  ${common_mm.HUB75_lib_deps}

lib_ignore =
  IRremoteESP8266                 ; not needed; saves compile time

; ---- Monitor ---------------------------------------------------------------
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
